<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>2026 상반기 실적 요약</title>
<link rel="stylesheet" href="../assets/deck.css">
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/regions.css">
</head>
<body>

<section class="slide" data-slide="02" data-title="2026 상반기 실적 요약">

  <header class="s-head" data-region="header" data-label="상단 헤더">
    <div>
      <p class="t-eyebrow" data-part="eyebrow">H1 REVIEW</p>
      <h2 class="t-head" data-part="title">2026 상반기 실적 요약</h2>
    </div>
    <span class="s-num">02</span>
  </header>

  <div class="grid-3">
    <div class="card edge" data-region="kpi-revenue" data-label="매출 KPI 카드">
      <p class="t-cap" data-part="label">누적 매출</p>
      <p class="t-kpi" data-part="value">142<span style="font-size:32px">억</span></p>
      <p class="t-small" data-part="delta">전년 동기 대비 <b class="em">+38%</b></p>
    </div>
    <div class="card edge" data-region="kpi-users" data-label="사용자 KPI 카드">
      <p class="t-cap" data-part="label">활성 고객사</p>
      <p class="t-kpi" data-part="value">316<span style="font-size:32px">곳</span></p>
      <p class="t-small" data-part="delta">신규 <b class="em">+74곳</b></p>
    </div>
    <div class="card edge" data-region="kpi-churn" data-label="이탈률 KPI 카드">
      <p class="t-cap" data-part="label">연간 이탈률</p>
      <p class="t-kpi" data-part="value">4.1<span style="font-size:32px">%</span></p>
      <p class="t-small" data-part="delta">목표 대비 <b class="em">-1.9%p</b></p>
    </div>
  </div>

  <div class="row fill">
    <div class="card fill" data-region="chart" data-label="분기별 매출 차트">
      <p class="t-cap">분기별 매출 (억원)</p>
      <div class="bars fill">
        <div class="b"><i style="--v:38%"></i><span>24 Q3</span></div>
        <div class="b"><i style="--v:47%"></i><span>24 Q4</span></div>
        <div class="b"><i style="--v:58%"></i><span>25 Q1</span></div>
        <div class="b"><i style="--v:71%"></i><span>25 Q2</span></div>
        <div class="b on"><i style="--v:92%"></i><span>26 Q1</span></div>
      </div>
    </div>
    <div class="col" style="width:400px">
      <div class="card brand fill" data-region="insight" data-label="핵심 인사이트 박스">
        <p class="t-head" style="font-size:20px" data-part="title">엔터프라이즈가 성장을 끌었다</p>
        <p class="t-small" data-part="body">신규 매출의 68%가 200인 이상 고객사에서 발생. 중소 세그먼트는 정체.</p>
      </div>
      <div class="card outline" data-region="risk" data-label="리스크 박스">
        <p class="t-cap" data-part="label">주의</p>
        <p class="t-small" data-part="body">Q2 파이프라인이 전분기 대비 12% 얇다.</p>
      </div>
    </div>
  </div>

  <footer class="s-foot" data-region="footer" data-label="하단 푸터">
    <span>2026 성장 전략</span>
    <span data-part="source">출처: 내부 BI, 2026-06-30 기준</span>
  </footer>

</section>

<script src="../assets/regions.js"></script>
</body>
</html>
