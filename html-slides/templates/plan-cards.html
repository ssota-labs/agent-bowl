<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>실행 계획</title>
<link rel="stylesheet" href="../assets/deck.css">
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/regions.css">
</head>
<body>

<section class="slide" data-slide="03" data-title="실행 계획">

  <header class="s-head" data-region="header" data-label="상단 헤더">
    <div>
      <p class="t-eyebrow" data-part="eyebrow">PLAN</p>
      <h2 class="t-head" data-part="title">실행 계획</h2>
    </div>
    <span class="s-num">03</span>
  </header>

  <div class="grid-2 fill">
    <div class="card" data-region="plan-1" data-label="계획 카드 1">
      <div class="chip">1</div>
      <p class="t-body strong" data-part="title">첫 번째 과제</p>
      <p class="t-small" data-part="body">설명을 입력하세요.</p>
    </div>
    <div class="card" data-region="plan-2" data-label="계획 카드 2">
      <div class="chip">2</div>
      <p class="t-body strong" data-part="title">두 번째 과제</p>
      <p class="t-small" data-part="body">설명을 입력하세요.</p>
    </div>
    <div class="card" data-region="plan-3" data-label="계획 카드 3">
      <div class="chip accent">3</div>
      <p class="t-body strong" data-part="title">세 번째 과제</p>
      <p class="t-small" data-part="body">설명을 입력하세요.</p>
    </div>
    <div class="card" data-region="plan-4" data-label="계획 카드 4">
      <div class="chip">4</div>
      <p class="t-body strong" data-part="title">네 번째 과제</p>
      <p class="t-small" data-part="body">설명을 입력하세요.</p>
    </div>
  </div>

  <footer class="s-foot" data-region="footer" data-label="하단 푸터">
    <span data-part="deck">덱</span>
    <span data-part="source">출처: —</span>
  </footer>

</section>

<script src="../assets/regions.js"></script>
</body>
</html>
