<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>표지</title>
<link rel="stylesheet" href="../assets/deck.css">
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/regions.css">
</head>
<body>

<section class="slide dark" data-slide="01" data-title="표지">

  <div class="bleed-r" data-overlap-ok
       style="background:radial-gradient(120% 90% at 85% 20%,var(--accent),transparent 62%);opacity:.42"></div>

  <div class="fill col" style="justify-content:center;max-width:780px;gap:22px"
       data-region="cover" data-label="표지 타이틀 영역">
    <p class="t-eyebrow" data-part="eyebrow">STRATEGY REVIEW</p>
    <h1 class="t-title" data-part="title">표지 제목</h1>
    <p class="t-sub" data-part="sub">부제를 입력하세요</p>
  </div>

  <footer class="s-foot" data-region="footer" data-label="하단 푸터">
    <span data-part="team">팀 이름</span>
    <span data-part="date">YYYY-MM-DD</span>
  </footer>

</section>

<script src="../assets/regions.js"></script>
</body>
</html>
